<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" xml:lang="ar">
<title id="t">طبقات الأمان في Nigafiy</title>
<desc id="d">كل طلب يمر بتسجيل الدخول والتحقق من الدور وعزل الجهات عبر أمان PostgreSQL على مستوى الصف والأسرار المشفّرة وسجل تدقيق لا يُعدَّل. الـ Sensor والـ Agent يتصلون للخارج فقط عبر HTTPS؛ الخادم لا يتصل أبداً بداخل أي موقع.</desc>
