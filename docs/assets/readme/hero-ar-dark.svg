<text x="1128" y="178" font-size="44" font-weight="700" fill="#EEF3FF" direction="rtl">اعرف شبكتك.</text>
<text x="1128" y="230" font-size="44" font-weight="700" fill="url(#headGrad)" direction="rtl">وافهم كل عطل.</text>
<text x="1128" y="274" font-size="17.5" fill="#C3CDE5" direction="rtl">سبعة برامج على محرك محلي واحد: اكتشاف ومراقبة</text>
<text x="1128" y="300" font-size="17.5" fill="#C3CDE5" direction="rtl">وحماية ودعم. مبني لنظام Windows، بالعربية والإنجليزية.</text>
