<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
<title id="t">Fleet remote desktop flow</title>
<desc id="d">A technician starts a session with a reason; the API checks the access policy; the Agent, which only ever dials out, picks up the command; the user consents and sees a banner where the access policy asks for it (unattended computers are silent by default); frames flow as WebSocket JPEG tiles relayed in memory, or as WebRTC H.264 directly on the LAN for Windows agents; every session is audited and can be recorded.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1830"/><stop offset="1" stop-color="#0A1122"/></linearGradient>
<linearGradient id="tileLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#22325A"/></pattern>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#3D5285" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#4C8DFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#7A4FD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#D13438" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>

<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Noto Sans Arabic', Tahoma, Helvetica, Arial, sans-serif}
.pk{animation-name:pk;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.4,1)}
@keyframes pk{0%{stroke-dashoffset:8}62%,100%{stroke-dashoffset:-101}}

.act{animation:act 14s ease-out infinite}
@keyframes act{0%{opacity:0}3%{opacity:.35}12%,100%{opacity:0}}
.pk{animation-name:pk7}
@keyframes pk7{0%{stroke-dashoffset:8}9%,100%{stroke-dashoffset:-101}}
.stream{animation:stream 1.6s linear infinite}
@keyframes stream{to{stroke-dashoffset:-17}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pk{display:none}.rm-show{opacity:1!important}}
</style>
</defs>
<rect x=".5" y=".5" width="999" height="599" rx="20" fill="url(#bg)" stroke="#1E2A45"/>
<rect x="1" y="1" width="998" height="598" rx="20" fill="url(#dots)" opacity=".55"/>
<line x1="170" y1="110" x2="170" y2="574" stroke="#3D5285" stroke-width="1.4" stroke-dasharray="3 6"/>
<line x1="500" y1="110" x2="500" y2="574" stroke="#3D5285" stroke-width="1.4" stroke-dasharray="3 6"/>
<line x1="830" y1="110" x2="830" y2="574" stroke="#3D5285" stroke-width="1.4" stroke-dasharray="3 6"/>
<g><rect x="52" y="26" width="236" height="70" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><g><rect x="68" y="41" width="40" height="40" rx="10" fill="#7A4FD6"/><rect x="68" y="41" width="40" height="40" rx="10" fill="url(#tileLight)"/><path d="M12 8m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0" transform="translate(77 50) scale(0.9167)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="120" y="58" font-size="16" font-weight="700" fill="#EEF3FF">Technician</text><text x="120" y="78" font-size="13" fill="#8E9BBD">Fleet console, any browser</text></g>
<g><rect x="382" y="26" width="236" height="70" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><g><rect x="398" y="41" width="40" height="40" rx="10" fill="#1A73FF"/><rect x="398" y="41" width="40" height="40" rx="10" fill="url(#tileLight)"/><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01" transform="translate(407 50) scale(0.9167)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="450" y="58" font-size="16" font-weight="700" fill="#EEF3FF">Nigafiy API</text><text x="450" y="78" font-size="13" fill="#8E9BBD">policy · relay · audit</text></g>
<g><rect x="712" y="26" width="236" height="70" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><g><rect x="728" y="41" width="40" height="40" rx="10" fill="#4B5563"/><rect x="728" y="41" width="40" height="40" rx="10" fill="url(#tileLight)"/><path d="M4 5h16v11H4zM9 20h6M12 16v4M9 10l2 2 4-4" transform="translate(737 50) scale(0.9167)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="780" y="58" font-size="16" font-weight="700" fill="#EEF3FF">Agent</text><text x="780" y="78" font-size="13" fill="#8E9BBD">on the managed computer</text></g>
<path d="M178 160H492" fill="none" stroke="#3D5285" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="pk glow" style="animation-duration:14s;animation-delay:-13.8s" d="M178 160H492" pathLength="100" fill="none" stroke="#7A4FD6" stroke-width="7" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8" opacity=".22"/><path class="pk" style="animation-duration:14s;animation-delay:-13.8s" d="M178 160H492" pathLength="100" fill="none" stroke="#7A4FD6" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8"/><rect x="156.8" y="127" width="356.4" height="24" rx="12" fill="#0d1529" opacity=".94"/><g><circle class="act" style="animation-delay:0.00s" cx="170.8" cy="139" r="15" fill="#4C8DFF" opacity="0"/><circle cx="170.8" cy="139" r="11" fill="#4C8DFF"/><text x="170.8" y="143.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">1</text></g><text x="188.8" y="144" font-size="13.5" font-weight="600" fill="#C3CDE5">Start session: reason, profile, MFA if asked</text>
<g><rect x="312.4" y="190" width="375.3" height="40" rx="12" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><rect x="312.4" y="190" width="4" height="40" rx="2" fill="#D13438"/><g><circle class="act" style="animation-delay:2.00s" cx="358.35" cy="210" r="15" fill="#D13438" opacity="0"/><circle cx="358.35" cy="210" r="11" fill="#D13438"/><text x="358.4" y="214.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">2</text></g><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6zM9 12l2 2 4-4" transform="translate(327.9 201.5) scale(0.7083)" fill="none" stroke="#D13438" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="382.4" y="215" font-size="13.5" font-weight="600" fill="#EEF3FF">Access policy: role · IP · hours · approval</text></g>
<path d="M822 280H508" fill="none" stroke="#3D5285" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="pk glow" style="animation-duration:14s;animation-delay:-9.8s" d="M822 280H508" pathLength="100" fill="none" stroke="#4B5563" stroke-width="7" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8" opacity=".22"/><path class="pk" style="animation-duration:14s;animation-delay:-9.8s" d="M822 280H508" pathLength="100" fill="none" stroke="#4B5563" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8"/><rect x="501" y="247" width="328" height="24" rx="12" fill="#0d1529" opacity=".94"/><g><circle class="act" style="animation-delay:4.00s" cx="515" cy="259" r="15" fill="#4B5563" opacity="0"/><circle cx="515" cy="259" r="11" fill="#4B5563"/><text x="515" y="263.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">3</text></g><text x="533" y="264" font-size="13.5" font-weight="600" fill="#C3CDE5">Agent polls out and picks up the command</text>
<g><rect x="644.2" y="310" width="339.8" height="40" rx="12" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><rect x="644.2" y="310" width="4" height="40" rx="2" fill="#2E8540"/><g><circle class="act" style="animation-delay:6.00s" cx="690.2" cy="330" r="15" fill="#2E8540" opacity="0"/><circle cx="690.2" cy="330" r="11" fill="#2E8540"/><text x="690.2" y="334.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">4</text></g><path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(659.7 321.5) scale(0.7083)" fill="none" stroke="#2E8540" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="714.2" y="335" font-size="13.5" font-weight="600" fill="#EEF3FF">Consent and banner as the policy sets</text></g>
<path d="M822 400H178" fill="none" stroke="#4C8DFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowA)"/><path class="pk glow" style="animation-duration:14s;animation-delay:-5.8s" d="M822 400H178" pathLength="100" fill="none" stroke="#4C8DFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8" opacity=".22"/><path class="pk" style="animation-duration:14s;animation-delay:-5.8s" d="M822 400H178" pathLength="100" fill="none" stroke="#4C8DFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8"/><rect x="304.1" y="367" width="391.9" height="24" rx="12" fill="#0d1529" opacity=".94"/><g><circle class="act" style="animation-delay:8.00s" cx="318.05" cy="379" r="15" fill="#4C8DFF" opacity="0"/><circle cx="318.05" cy="379" r="11" fill="#4C8DFF"/><text x="318.1" y="383.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">5</text></g><text x="336.1" y="384" font-size="13.5" font-weight="600" fill="#C3CDE5">Screen as WebSocket JPEG tiles, relayed in memory</text>
<path d="M822 460H178" fill="none" stroke="#7A4FD6" stroke-width="2.2" stroke-dasharray="2 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowP)"/><path class="pk glow" style="animation-duration:14s;animation-delay:-3.8s" d="M822 460H178" pathLength="100" fill="none" stroke="#7A4FD6" stroke-width="7" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8" opacity=".22"/><path class="pk" style="animation-duration:14s;animation-delay:-3.8s" d="M822 460H178" pathLength="100" fill="none" stroke="#7A4FD6" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8"/><rect x="321.8" y="427" width="356.4" height="24" rx="12" fill="#0d1529" opacity=".94"/><g><circle class="act" style="animation-delay:10.00s" cx="335.8" cy="439" r="15" fill="#7A4FD6" opacity="0"/><circle cx="335.8" cy="439" r="11" fill="#7A4FD6"/><text x="335.8" y="443.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">6</text></g><text x="353.8" y="444" font-size="13.5" font-weight="600" fill="#C3CDE5">Or WebRTC H.264, direct on the LAN (Windows)</text>
<g><rect x="308.8" y="490" width="382.4" height="40" rx="12" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><rect x="308.8" y="490" width="4" height="40" rx="2" fill="#1466E6"/><g><circle class="act" style="animation-delay:12.00s" cx="354.8" cy="510" r="15" fill="#1466E6" opacity="0"/><circle cx="354.8" cy="510" r="11" fill="#1466E6"/><text x="354.8" y="514.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">7</text></g><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" transform="translate(324.3 501.5) scale(0.7083)" fill="none" stroke="#1466E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="378.8" y="515" font-size="13.5" font-weight="600" fill="#EEF3FF">Audit log · optional recording (server path)</text></g>
<path class="stream" d="M822 400H178" fill="none" stroke="#4C8DFF" stroke-width="2.6" stroke-dasharray="3 14" stroke-linecap="round" opacity=".55"/>
</svg>
