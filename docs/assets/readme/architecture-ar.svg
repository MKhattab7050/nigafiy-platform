<title id="t">بنية Nigafiy</title>
<desc id="d">كل شيء يعمل على حاسوب المسؤول بنظام Windows على عنوان loopback: المحرك يشرف على PostgreSQL والـ API ولوحة الويب والـ Sensor المحلي. الـ Sensor في المواقع الأخرى والـ Agent على الأجهزة المُدارة يتصلون للخارج بالـ API عبر HTTPS.</desc>
