<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d" xml:lang="ar">
<title id="t">مسار سطح المكتب البعيد في Fleet</title>
<desc id="d">الفني يبدأ جلسة مع ذكر السبب؛ الـ API يتحقق من سياسة الوصول؛ الـ Agent، الذي يتصل للخارج فقط، يستلم الأمر؛ المستخدم يوافق ويرى شريط التنبيه حين تطلب سياسة الوصول ذلك (الحواسيب غير الحضورية صامتة افتراضياً)؛ الصورة تمر كمربعات JPEG عبر WebSocket في الذاكرة، أو WebRTC H.264 مباشرة على الشبكة المحلية لأجهزة Windows؛ كل جلسة مسجّلة ويمكن تسجيلها.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F6FD"/></linearGradient>
<linearGradient id="tileLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#C9D5EC"/></pattern>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0B1F5C" flood-opacity="0.09"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#AFBEDA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#1A73FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#7A4FD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#D13438" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>

<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Noto Sans Arabic', Tahoma, Helvetica, Arial, sans-serif}
.pk{animation-name:pk;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.4,1)}
@keyframes pk{0%{stroke-dashoffset:8}62%,100%{stroke-dashoffset:-101}}

.act{animation:act 14s ease-out infinite}
@keyframes act{0%{opacity:0}3%{opacity:.35}12%,100%{opacity:0}}
.pk{animation-name:pk7}
@keyframes pk7{0%{stroke-dashoffset:8}9%,100%{stroke-dashoffset:-101}}
.stream{animation:stream 1.6s linear infinite}
@keyframes stream{to{stroke-dashoffset:17}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pk{display:none}.rm-show{opacity:1!important}}
</style>
