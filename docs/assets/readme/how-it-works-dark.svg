<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 288" width="1000" height="288" role="img" aria-labelledby="t d">
<title id="t">How Nigafiy works</title>
<desc id="d">Four steps: discover every device, watch it and explain incidents with evidence, alert the right people, act on the router, switch, DNS or computer.</desc>
