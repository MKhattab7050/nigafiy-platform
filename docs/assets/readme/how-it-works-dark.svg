<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-labelledby="t d">
<title id="t">How Nigafiy works</title>
<desc id="d">Four steps: discover devices, watch them, alert on changes, act on the network or the computer.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.step{animation:hi 4s ease-in-out infinite;opacity:.55}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 4s ease-out infinite;opacity:0}
.dot{animation:move 4s ease-in-out infinite;opacity:0}
@keyframes hi{0%,30%{opacity:1}45%,100%{opacity:.55}}
@keyframes ring{0%{transform:scale(1);opacity:.7}30%{transform:scale(1.5);opacity:0}100%{opacity:0}}
@keyframes move{0%{transform:translateX(0);opacity:0}5%{opacity:1}25%{transform:translateX(198px);opacity:1}30%,100%{transform:translateX(198px);opacity:0}}
@media (prefers-reduced-motion: reduce){.step,.ring,.dot{animation:none!important}.step{opacity:1}}
</style>
<line x1="196" y1="70" x2="404" y2="70" stroke="#3A5BB0" stroke-width="2" stroke-dasharray="4 6"/><path d="M396 64L404 70L396 76" fill="none" stroke="#3A5BB0" stroke-width="2" stroke-linecap="round"/><circle class="dot" style="animation-delay:0s" cx="196" cy="70" r="5" fill="#1A73FF"/><line x1="496" y1="70" x2="704" y2="70" stroke="#3A5BB0" stroke-width="2" stroke-dasharray="4 6"/><path d="M696 64L704 70L696 76" fill="none" stroke="#3A5BB0" stroke-width="2" stroke-linecap="round"/><circle class="dot" style="animation-delay:1s" cx="496" cy="70" r="5" fill="#1A73FF"/><line x1="796" y1="70" x2="1004" y2="70" stroke="#3A5BB0" stroke-width="2" stroke-dasharray="4 6"/><path d="M996 64L1004 70L996 76" fill="none" stroke="#3A5BB0" stroke-width="2" stroke-linecap="round"/><circle class="dot" style="animation-delay:2s" cx="796" cy="70" r="5" fill="#1A73FF"/>
<g class="step" style="animation-delay:0s">
<circle class="ring" style="animation-delay:0s" cx="150" cy="70" r="34" fill="none" stroke="#0099BC" stroke-width="2"/>
<circle cx="150" cy="70" r="34" fill="#0099BC"/>
<path d="M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0-16 0M12 12m-3.5 0a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M12 12l5.5-5.5" transform="translate(137.0 57) scale(1.0833)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1. Discover</text>
<text x="150" y="158" text-anchor="middle" font-size="14" fill="#B9C6EA">Sensor finds every device</text>
</g><g class="step" style="animation-delay:1s">
<circle class="ring" style="animation-delay:1s" cx="450" cy="70" r="34" fill="none" stroke="#C27C0E" stroke-width="2"/>
<circle cx="450" cy="70" r="34" fill="#C27C0E"/>
<path d="M3 12h4l2-5 4 10 2-5h6" transform="translate(437.0 57) scale(1.0833)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2. Watch</text>
<text x="450" y="158" text-anchor="middle" font-size="14" fill="#B9C6EA">Checks, events, incidents</text>
</g><g class="step" style="animation-delay:2s">
<circle class="ring" style="animation-delay:2s" cx="750" cy="70" r="34" fill="none" stroke="#D13438" stroke-width="2"/>
<circle cx="750" cy="70" r="34" fill="#D13438"/>
<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" transform="translate(737.0 57) scale(1.0833)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="750" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3. Alert</text>
<text x="750" y="158" text-anchor="middle" font-size="14" fill="#B9C6EA">Email, webhooks, chat apps</text>
</g><g class="step" style="animation-delay:3s">
<circle class="ring" style="animation-delay:3s" cx="1050" cy="70" r="34" fill="none" stroke="#7A4FD6" stroke-width="2"/>
<circle cx="1050" cy="70" r="34" fill="#7A4FD6"/>
<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z" transform="translate(1037.0 57) scale(1.0833)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1050" y="134" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">4. Act</text>
<text x="1050" y="158" text-anchor="middle" font-size="14" fill="#B9C6EA">Router, switch, DNS, Fleet</text>
</g>
</svg>
