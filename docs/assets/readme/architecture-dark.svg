<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 744" width="1000" height="744" role="img" aria-labelledby="t d">
<title id="t">Nigafiy architecture</title>
<desc id="d">Everything runs on the admin's Windows PC on loopback: the engine supervises PostgreSQL, the API, the web console and the local Sensor. Sensors at other sites and Agents on managed computers dial out to the API over HTTPS; the Sensor reaches the LAN with ICMP, ARP, SNMP, SSH and router APIs.</desc>
