<rect x="351.7" y="425" width="262.6" height="20" rx="10" fill="#0d1529" opacity=".96"/><text x="483" y="439" text-anchor="middle" font-size="12" font-weight="600" fill="#D13438">The server never connects into a site</text>
</svg>
