<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
<title id="t">Nigafiy security layers</title>
<desc id="d">Every request passes sign-in, role checks, tenant isolation with PostgreSQL Row Level Security, sealed secrets and an append-only audit log. Sensors and Agents only dial out over HTTPS; the server never connects into a site.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1830"/><stop offset="1" stop-color="#0A1122"/></linearGradient>
<linearGradient id="tileLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#22325A"/></pattern>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#3D5285" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#4C8DFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#7A4FD6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#D13438" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>

<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Noto Sans Arabic', Tahoma, Helvetica, Arial, sans-serif}
.pk{animation-name:pk;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.4,1)}
@keyframes pk{0%{stroke-dashoffset:8}62%,100%{stroke-dashoffset:-101}}

.req{animation:pkr 6s cubic-bezier(.45,0,.4,1) infinite}
@keyframes pkr{0%{stroke-dashoffset:5}80%,100%{stroke-dashoffset:-101}}
.gate{animation:gate 6s ease-in-out infinite}
@keyframes gate{0%,4%{opacity:0}9%{opacity:.9}20%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.pk{display:none}.rm-show{opacity:1!important}}
</style>
</defs>
<rect x=".5" y=".5" width="999" height="539" rx="20" fill="url(#bg)" stroke="#1E2A45"/>
<rect x="1" y="1" width="998" height="538" rx="20" fill="url(#dots)" opacity=".55"/>
<text x="26" y="44" font-size="12" font-weight="700" fill="#8E9BBD" letter-spacing="1.2">EVERY REQUEST</text>
<path d="M16 106H984" stroke="#3D5285" stroke-width="1.6" stroke-dasharray="2 6" fill="none"/>
<path class="pk req" d="M16 106H984" pathLength="100" fill="none" stroke="#4C8DFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 300" stroke-dashoffset="5"/>
<g><rect x="26" y="64" width="172" height="160" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/>
<rect class="gate" style="animation-delay:0.00s" x="26" y="64" width="172" height="160" rx="14" fill="none" stroke="#1466E6" stroke-width="2" opacity="0"/>
<g><rect x="44" y="88" width="36" height="36" rx="9" fill="#1466E6"/><rect x="44" y="88" width="36" height="36" rx="9" fill="url(#tileLight)"/><path d="M12 8m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0" transform="translate(52.1 96.1) scale(0.825)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(164 98) scale(0.6667)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="156" font-size="16" font-weight="700" fill="#EEF3FF">Sign-in</text>
<text x="44" y="178" font-size="13" fill="#8E9BBD">scrypt passwords</text><text x="44" y="196" font-size="13" fill="#8E9BBD">TOTP MFA · SSO</text><text x="44" y="214" font-size="13" fill="#8E9BBD">rate limited</text></g>
<g><rect x="220" y="64" width="172" height="160" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/>
<rect class="gate" style="animation-delay:0.90s" x="220" y="64" width="172" height="160" rx="14" fill="none" stroke="#C27C0E" stroke-width="2" opacity="0"/>
<g><rect x="238" y="88" width="36" height="36" rx="9" fill="#C27C0E"/><rect x="238" y="88" width="36" height="36" rx="9" fill="url(#tileLight)"/><path d="M14.5 9.5m-4 0a4 4 0 1 0 8 0a4 4 0 1 0-8 0M11.6 12.4L4 20M7 17l2 2M5 19l1.5 1.5" transform="translate(246.1 96.1) scale(0.825)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(358 98) scale(0.6667)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="238" y="156" font-size="16" font-weight="700" fill="#EEF3FF">Roles</text>
<text x="238" y="178" font-size="13" fill="#8E9BBD">owner · admin</text><text x="238" y="196" font-size="13" fill="#8E9BBD">technician · viewer</text><text x="238" y="214" font-size="13" fill="#8E9BBD">checked on the server</text></g>
<g><rect x="414" y="64" width="172" height="160" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/>
<rect class="gate" style="animation-delay:1.80s" x="414" y="64" width="172" height="160" rx="14" fill="none" stroke="#0099BC" stroke-width="2" opacity="0"/>
<g><rect x="432" y="88" width="36" height="36" rx="9" fill="#0099BC"/><rect x="432" y="88" width="36" height="36" rx="9" fill="url(#tileLight)"/><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" transform="translate(440.1 96.1) scale(0.825)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(552 98) scale(0.6667)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="432" y="156" font-size="16" font-weight="700" fill="#EEF3FF">Tenant isolation</text>
<text x="432" y="178" font-size="13" fill="#8E9BBD">PostgreSQL RLS</text><text x="432" y="196" font-size="13" fill="#8E9BBD">per organization</text><text x="432" y="214" font-size="13" fill="#8E9BBD">composite keys</text></g>
<g><rect x="608" y="64" width="172" height="160" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/>
<rect class="gate" style="animation-delay:2.70s" x="608" y="64" width="172" height="160" rx="14" fill="none" stroke="#7A4FD6" stroke-width="2" opacity="0"/>
<g><rect x="626" y="88" width="36" height="36" rx="9" fill="#7A4FD6"/><rect x="626" y="88" width="36" height="36" rx="9" fill="url(#tileLight)"/><path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4" transform="translate(634.1 96.1) scale(0.825)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(746 98) scale(0.6667)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="626" y="156" font-size="16" font-weight="700" fill="#EEF3FF">Sealed secrets</text>
<text x="626" y="178" font-size="13" fill="#8E9BBD">AES-256-GCM</text><text x="626" y="196" font-size="13" fill="#8E9BBD">write-only</text><text x="626" y="214" font-size="13" fill="#8E9BBD">key rotation</text></g>
<g><rect x="802" y="64" width="172" height="160" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/>
<rect class="gate" style="animation-delay:3.60s" x="802" y="64" width="172" height="160" rx="14" fill="none" stroke="#2E8540" stroke-width="2" opacity="0"/>
<g><rect x="820" y="88" width="36" height="36" rx="9" fill="#2E8540"/><rect x="820" y="88" width="36" height="36" rx="9" fill="url(#tileLight)"/><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" transform="translate(828.1 96.1) scale(0.825)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(940 98) scale(0.6667)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="820" y="156" font-size="16" font-weight="700" fill="#EEF3FF">Audit log</text>
<text x="820" y="178" font-size="13" fill="#8E9BBD">append-only</text><text x="820" y="196" font-size="13" fill="#8E9BBD">actor and reason</text><text x="820" y="214" font-size="13" fill="#8E9BBD">same transaction</text></g>
<text x="26" y="280" font-size="12" font-weight="700" fill="#8E9BBD" letter-spacing="1.2">EVERY CONNECTION</text>
<rect x="26" y="300" width="300" height="212" rx="16" fill="#0D1529" fill-opacity=".7" stroke="#34477A" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="44" y="289" width="110.8" height="22" rx="11" fill="#0F1830" stroke="#34477A"/><text x="99.4" y="304.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8E9BBD" letter-spacing="1.1">SITE NETWORK</text>
<g><rect x="46" y="330" width="260" height="68" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><g><rect x="62" y="346" width="36" height="36" rx="9" fill="#3D6E7A"/><rect x="62" y="346" width="36" height="36" rx="9" fill="url(#tileLight)"/><path d="M12 18v3M8 21h8M12 14m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8.5 10.5a5 5 0 0 1 7 0M5.5 7.5a9 9 0 0 1 13 0" transform="translate(70.1 354.1) scale(0.825)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="112" y="360" font-size="15.5" font-weight="700" fill="#EEF3FF">Sensor</text><text x="112" y="380" font-size="13" fill="#8E9BBD">observer and prober, no shell</text></g>
<g><rect x="46" y="422" width="260" height="68" rx="14" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><g><rect x="62" y="438" width="36" height="36" rx="9" fill="#7A4FD6"/><rect x="62" y="438" width="36" height="36" rx="9" fill="url(#tileLight)"/><path d="M4 5h16v11H4zM9 20h6M12 16v4M9 10l2 2 4-4" transform="translate(70.1 446.1) scale(0.825)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="112" y="452" font-size="15.5" font-weight="700" fill="#EEF3FF">Agent</text><text x="112" y="472" font-size="13" fill="#8E9BBD">closed list of typed actions</text></g>
<g><rect x="640" y="300" width="334" height="212" rx="16" fill="#131D36" stroke="#26365C" filter="url(#sh)"/><g><rect x="660" y="322" width="44" height="44" rx="11" fill="#1A73FF"/><rect x="660" y="322" width="44" height="44" rx="11" fill="url(#tileLight)"/><path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01" transform="translate(669.9 331.9) scale(1.0083)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="716" y="342" font-size="17" font-weight="700" fill="#EEF3FF">Nigafiy API</text><text x="716" y="360" font-size="12.5" fill="#8E9BBD" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Consolas, 'Liberation Mono', monospace">HTTPS · :47100</text>
<path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(662.5 396.5) scale(0.625)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="409" font-size="13.5" fill="#C3CDE5">commands from a closed allow-list</text><path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(662.5 428.5) scale(0.625)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="441" font-size="13.5" fill="#C3CDE5">every payload checked with Zod</text><path d="M5 12.5l4.5 4.5L19 7.5" transform="translate(662.5 460.5) scale(0.625)" fill="none" stroke="#2E8540" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="473" font-size="13.5" fill="#C3CDE5">per-machine credential, revocable</text></g>
<path d="M310 364H634" fill="none" stroke="#2E8540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="pk glow" style="animation-duration:3.2s;animation-delay:-0.5s" d="M310 364H634" pathLength="100" fill="none" stroke="#2E8540" stroke-width="7" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8" opacity=".22"/><path class="pk" style="animation-duration:3.2s;animation-delay:-0.5s" d="M310 364H634" pathLength="100" fill="none" stroke="#2E8540" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8"/>
<path d="M310 456H634" fill="none" stroke="#2E8540" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path class="pk glow" style="animation-duration:3.2s;animation-delay:-2.1s" d="M310 456H634" pathLength="100" fill="none" stroke="#2E8540" stroke-width="7" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8" opacity=".22"/><path class="pk" style="animation-duration:3.2s;animation-delay:-2.1s" d="M310 456H634" pathLength="100" fill="none" stroke="#2E8540" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 300" stroke-dashoffset="8"/>
<path d="M634 410H332" fill="none" stroke="#D13438" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrowR)" opacity=".8"/>
