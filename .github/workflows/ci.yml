name: CI

on:
  push:
    branches: [main, master, phase-2-network-intelligence]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The product ships as Windows programs, so the main gate runs on Windows.
  # Cost note: on a private repository, minutes on Windows runners count double (2x) against the
  # account's included Actions minutes.
  verify:
    name: Typecheck, lint, tests, build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: collectors/lan-collector/go.mod
          cache-dependency-path: |
            collectors/lan-collector/go.sum
            agents/endpoint-agent/go.sum
            engine/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Brand check (old product name)
        run: pnpm check:brand

      - name: Go vet
        shell: bash
        run: |
          (cd collectors/lan-collector && go vet ./...)
          (cd agents/endpoint-agent && go vet ./...)
          (cd engine && go vet ./...)

      - name: Collector tests
        run: pnpm test:collector

      - name: Endpoint agent tests
        run: pnpm test:agent

      - name: Engine tests
        run: pnpm test:engine

      - name: API integration tests (real PostgreSQL + RLS)
        run: pnpm test

      - name: Desktop tests
        run: pnpm --filter @nigafiy/desktop test

      - name: Brand tests
        run: pnpm --filter @nigafiy/brand test

      - name: Web unit tests
        run: pnpm --filter @nigafiy/web test:unit

      - name: Build (brand files, then the web production build)
        run: pnpm build

      - name: Generated brand sources match the commit
        shell: bash
        run: git diff --exit-code -- packages/brand/svg packages/brand/src

      - name: Web browser smoke tests (EN + AR/RTL, CSP)
        run: pnpm test:web

      # The website (apps/site): static export, unit tests and browser tests of the export. Build and
      # test only: nothing is deployed (hosting is not decided, docs/website.md).
      - name: Website static build
        run: pnpm build:site

      - name: Website tests (unit + browser, EN light / AR dark, links, downloads)
        run: pnpm test:site

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/site/playwright-report
            apps/site/test-results
          retention-days: 7

  # Go checks that need Linux or cgo (the race detector), the fuzz smoke and the Go and npm
  # vulnerability scans: three Linux jobs in parallel with the Windows gate (Linux minutes count 1x).
  # How the Go tests run here and locally: docs/getting-started.md ("Go tests in CI").
  go-race:
    name: Go tests with the race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: collectors/lan-collector/go.mod
          cache-dependency-path: |
            collectors/lan-collector/go.sum
            agents/endpoint-agent/go.sum
            engine/go.sum

      - name: go test -race (agent, Sensor, engine)
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOFLAGS: -mod=readonly
        run: |
          (cd agents/endpoint-agent && go test -race -count=1 ./...)
          (cd collectors/lan-collector && go test -race -count=1 ./...)
          (cd engine && go test -race -count=1 ./...)

  go-fuzz:
    name: Go fuzz smoke (Linux, 30 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: collectors/lan-collector/go.mod
          cache-dependency-path: |
            collectors/lan-collector/go.sum
            agents/endpoint-agent/go.sum
            engine/go.sum

      - name: Fuzz smoke
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: bash scripts/go-fuzz-smoke.sh 30s

      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: go-fuzz-failures
          path: |
            collectors/lan-collector/internal/*/testdata/fuzz
            agents/endpoint-agent/internal/*/testdata/fuzz
          retention-days: 7

  vulnerability-scans:
    name: govulncheck and pnpm audit (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: collectors/lan-collector/go.mod
          cache-dependency-path: |
            collectors/lan-collector/go.sum
            agents/endpoint-agent/go.sum
            engine/go.sum

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --audit-level=high --prod

      - name: govulncheck v1.10.0 (agent, Sensor, engine)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          vc="$(go env GOPATH)/bin/govulncheck"
          (cd agents/endpoint-agent && "$vc" ./...)
          (cd collectors/lan-collector && "$vc" ./...)
          (cd engine && "$vc" ./...)
