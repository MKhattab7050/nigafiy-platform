name: CI

on:
  push:
    branches: [main, master, phase-2-network-intelligence]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The product ships as Windows programs, so the main gate runs on Windows.
  # Cost note: on a private repository, minutes on Windows runners count double (2x) against the
  # account's included Actions minutes.
  verify:
    name: Typecheck, lint, tests, build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: collectors/lan-collector/go.mod
          cache-dependency-path: |
            collectors/lan-collector/go.sum
            agents/endpoint-agent/go.sum
            engine/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Brand check (old product name)
        run: pnpm check:brand

      - name: Go vet
        shell: bash
        run: |
          (cd collectors/lan-collector && go vet ./...)
          (cd agents/endpoint-agent && go vet ./...)
          (cd engine && go vet ./...)

      - name: Collector tests
        run: pnpm test:collector

      - name: Endpoint agent tests
        run: pnpm test:agent

      - name: Engine tests
        run: pnpm test:engine

      - name: API integration tests (real PostgreSQL + RLS)
        run: pnpm test

      - name: Desktop tests
        run: pnpm --filter @nigafiy/desktop test

      - name: Brand tests
        run: pnpm --filter @nigafiy/brand test

      - name: Web unit tests
        run: pnpm --filter @nigafiy/web test:unit

      - name: Build (brand files, then the web production build)
        run: pnpm build

      - name: Generated brand sources match the commit
        shell: bash
        run: git diff --exit-code -- packages/brand/svg packages/brand/src

      - name: Web browser smoke tests (EN + AR/RTL, CSP)
        run: pnpm test:web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
