<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Nigafiy programs</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px; background: #070d1a; color: #e6edf7; font: 14px system-ui, 'Segoe UI', sans-serif; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #9fb0c8; margin: 0 0 16px; line-height: 1.5; }
      label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
      label.fixed { color: #9fb0c8; }
      .actions { display: flex; gap: 8px; margin-top: 20px; }
      button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #22406e; background: #10203d; color: #e6edf7; cursor: pointer; }
      button.primary { background: #2f6fe0; border-color: #2f6fe0; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 14px; min-height: 1.5em; color: #9fb0c8; white-space: pre-line; }
      #status.error { color: #ff8a8a; }
    </style>
  </head>
  <body>
    <h1 id="title">Choose Nigafiy programs</h1>
    <p id="intro"></p>
    <form id="form">
      <label class="fixed"><input type="checkbox" checked disabled /> <span id="hub"></span></label>
      <div id="choices"></div>
      <div class="actions">
        <button type="submit" class="primary" id="save"></button>
        <button type="button" id="close"></button>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="chooser.js"></script>
  </body>
</html>
